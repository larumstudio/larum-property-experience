<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="mSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5a5e;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#6a7a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a4840;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5a8a8e;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#4a7a7e;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#3a5a5e;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="sunWash" x1="70%" y1="0%" x2="30%" y2="80%">
      <stop offset="0%" style="stop-color:#d4a84a;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#d4a84a;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="poolEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7aaba8;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#4a7a78;stop-opacity:0.3" />
    </linearGradient>
    <filter id="mGlow">
      <feGaussianBlur stdDeviation="50" />
    </filter>
    <filter id="waterRipple">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#mSky)"/>
  <!-- Warm golden hour light -->
  <ellipse cx="1400" cy="300" rx="700" ry="500" fill="url(#sunWash)" filter="url(#mGlow)"/>
  <!-- Landscape / garden area -->
  <rect x="0" y="0" width="1920" height="520" fill="#3a4a3e" opacity="0.4"/>
  <!-- Vegetation silhouettes -->
  <ellipse cx="120" cy="380" rx="140" ry="200" fill="#2a3a2e" opacity="0.6"/>
  <ellipse cx="350" cy="400" rx="100" ry="160" fill="#2a3a2e" opacity="0.5"/>
  <ellipse cx="1700" cy="360" rx="160" ry="220" fill="#2a3a2e" opacity="0.55"/>
  <ellipse cx="1880" cy="400" rx="120" ry="180" fill="#2a3a2e" opacity="0.5"/>
  <!-- Distant hill/mountain line -->
  <path d="M0,280 Q300,220 600,260 Q900,200 1200,240 Q1500,210 1920,250 L1920,350 Q1200,310 600,340 Q300,360 0,340 Z" fill="#4a5a4e" opacity="0.3"/>
  <!-- Pool deck -->
  <rect x="300" y="520" width="1320" height="30" fill="#8a8274" opacity="0.4"/>
  <!-- Infinity pool -->
  <rect x="300" y="550" width="1320" height="280" fill="url(#water)" rx="2"/>
  <!-- Pool water reflections -->
  <line x1="400" y1="600" x2="700" y2="600" stroke="#8abab8" stroke-width="0.8" opacity="0.15"/>
  <line x1="500" y1="650" x2="900" y2="650" stroke="#8abab8" stroke-width="0.6" opacity="0.12"/>
  <line x1="350" y1="700" x2="800" y2="700" stroke="#8abab8" stroke-width="0.7" opacity="0.1"/>
  <line x1="600" y1="740" x2="1100" y2="740" stroke="#8abab8" stroke-width="0.5" opacity="0.1"/>
  <line x1="900" y1="620" x2="1300" y2="620" stroke="#8abab8" stroke-width="0.6" opacity="0.12"/>
  <line x1="1000" y1="680" x2="1500" y2="680" stroke="#8abab8" stroke-width="0.8" opacity="0.1"/>
  <!-- Golden hour reflection on water -->
  <ellipse cx="1200" cy="650" rx="300" ry="120" fill="#d4a84a" opacity="0.08" filter="url(#waterRipple)"/>
  <!-- Pool edge — infinity line -->
  <line x1="300" y1="830" x2="1620" y2="830" stroke="#7a9a98" stroke-width="1.5" opacity="0.4"/>
  <!-- Terrace/deck below pool -->
  <rect x="0" y="830" width="1920" height="250" fill="#3a3a32" opacity="0.7"/>
  <!-- Terrace furniture silhouettes -->
  <rect x="450" y="870" width="200" height="40" rx="6" fill="#2a2a24" opacity="0.4"/>
  <rect x="430" y="860" width="40" height="60" rx="4" fill="#2a2a24" opacity="0.35"/>
  <rect x="670" y="860" width="40" height="60" rx="4" fill="#2a2a24" opacity="0.35"/>
  <rect x="1200" y="880" width="160" height="35" rx="4" fill="#2a2a24" opacity="0.35"/>
  <ellipse cx="1380" cy="890" rx="25" ry="25" fill="#2a2a24" opacity="0.25"/>
  <!-- Architecture — villa structure hint -->
  <rect x="0" y="300" width="260" height="530" fill="#3a3a32" opacity="0.5"/>
  <rect x="1660" y="280" width="260" height="550" fill="#3a3a32" opacity="0.5"/>
  <!-- Villa roof line -->
  <line x1="0" y1="300" x2="260" y2="300" stroke="#5a5a50" stroke-width="1.5" opacity="0.3"/>
  <line x1="1660" y1="280" x2="1920" y2="280" stroke="#5a5a50" stroke-width="1.5" opacity="0.3"/>
  <!-- Bottom vignette -->
  <rect x="0" y="900" width="1920" height="180" fill="#2a3028" opacity="0.6"/>
  <text x="1860" y="1050" font-family="Georgia, serif" font-size="11" fill="#7a9a88" text-anchor="end" opacity="0.25" letter-spacing="0.15em">LARUM · VILLA CASIA</text>
</svg>
