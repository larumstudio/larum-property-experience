<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Larum Admin — Property Experience</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=6"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap');

    *{box-sizing:border-box;margin:0;padding:0}

    :root{
      --bg:#0f0f0e;
      --surface:#1a1917;
      --surface-2:#232220;
      --ink:#e8e6e1;
      --text:#a8a49c;
      --muted:#706c64;
      --line:#2a2926;
      --line-soft:#222120;
      --gold:#c5ab75;
      --gold-dim:rgba(197,171,117,.12);
      --green:#5a8a6a;
      --green-dim:rgba(90,138,106,.12);
      --red:#a05555;
      --red-dim:rgba(160,85,85,.12);
      --orange:#b8884a;
      --orange-dim:rgba(184,136,74,.12);
      --accent:#7FA9B0;
      --accent-dim:rgba(127,169,176,.12);
      --radius:10px;
      --radius-sm:6px;
      --radius-badge:20px;
      --font-display:'Playfair Display',Georgia,'Times New Roman',serif;
      --font-body:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;
      --font-mono:'SF Mono','Cascadia Code','Courier New',monospace;
    }

    body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:300;font-size:14px;-webkit-font-smoothing:antialiased;line-height:1.5}
    button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
    .mono{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

    /* ── Gate ───────────────────────────────────────────── */
    .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
    .gate-box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:36px 32px}
    .gate-box h1{font-family:var(--font-display);font-size:22px;font-weight:400;letter-spacing:-.01em;color:var(--ink)}
    .gate-box .sub{margin:6px 0 26px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
    .field input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--ink)}
    .field input:focus{outline:none;border-color:var(--gold)}
    .btn{padding:9px 18px;border-radius:var(--radius-sm);cursor:pointer;transition:all .18s;font-size:13px;border:1px solid transparent;font-weight:400}
    .btn-primary{background:var(--gold);color:var(--bg)}
    .btn-primary:hover{background:#d4ba84}
    .btn-primary[disabled]{opacity:.5;cursor:default}
    .btn-outline{background:transparent;border-color:var(--line);color:var(--text)}
    .btn-outline:hover{border-color:var(--muted);color:var(--ink)}
    .btn-full{width:100%;margin-top:8px}
    .gate-error{margin-top:14px;font-size:12px;color:var(--red);line-height:1.5}
    .gate-note{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.6}

    /* ── Shell ──────────────────────────────────────────── */
    .app{display:none}
    .app.on{display:flex;min-height:100vh}

    /* ── Sidebar ─────────────────────────────────────────── */
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10;overflow-y:auto}
    .sidebar-brand{padding:22px 22px 18px;border-bottom:1px solid var(--line)}
    .sidebar-brand h2{font-family:var(--font-display);font-size:16px;font-weight:400;letter-spacing:.04em;color:var(--ink)}
    .sidebar-brand small{font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:.14em;display:block;margin-top:5px}
    .sidebar-nav{flex:1;padding:10px 0;display:flex;flex-direction:column}
    .sidebar-nav button{display:flex;width:100%;align-items:center;gap:11px;padding:10px 22px;background:none;border:0;color:var(--text);text-align:left;cursor:pointer;font-size:13px;letter-spacing:.02em;transition:all .18s;position:relative}
    .sidebar-nav button:hover{color:var(--ink);background:rgba(255,255,255,.03)}
    .sidebar-nav button.active{color:var(--gold);background:var(--gold-dim)}
    .sidebar-nav button.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--gold);border-radius:1px}
    .sidebar-nav button .icon{width:18px;text-align:center;font-size:14px;opacity:.7}
    .sidebar-nav button.active .icon{opacity:1}
    .sidebar-nav button .count{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
    .sidebar-foot{padding:16px 22px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.6;margin-top:auto}
    .sidebar-foot .who{color:var(--text);word-break:break-all;display:block;margin-bottom:8px}
    .sidebar-foot button{background:none;border:0;color:var(--gold);cursor:pointer;font-size:11px;letter-spacing:.06em;padding:0}
    .sidebar-foot button:hover{text-decoration:underline}

    /* ── Main area ────────────────────────────────────────── */
    .main{margin-left:220px;flex:1;min-height:100vh;display:flex;flex-direction:column}
    .topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;justify-content:flex-end;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
    .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .topbar select,.topbar input[type=search]{padding:7px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:12px;background:var(--surface-2);color:var(--ink)}
    .topbar select:focus,.topbar input[type=search]:focus{outline:none;border-color:var(--gold)}
    .topbar input[type=search]{width:180px}
    .topbar input[type=search]::placeholder{color:var(--muted)}
    .content{padding:24px 28px 60px;flex:1}

    .banner{background:var(--red-dim);border:1px solid rgba(160,85,85,.25);color:#d49a9a;border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;font-size:12.5px;line-height:1.65;display:none}
    .banner.on{display:block}
    .banner code{font-family:var(--font-mono);background:rgba(255,255,255,.06);padding:1px 5px;border-radius:3px}

    /* ── Mobile hamburger ───────────────────────────────── */
    .menu-toggle{display:none;background:none;border:0;color:var(--ink);font-size:22px;cursor:pointer;padding:4px;line-height:1}
    .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;opacity:0;pointer-events:none;transition:opacity .28s}
    .sidebar-overlay.on{opacity:1;pointer-events:auto}

    /* ── Page headers ────────────────────────────────────── */
    .page-header{margin-bottom:24px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
    .page-header h2{font-family:var(--font-display);font-size:22px;font-weight:400;letter-spacing:-.01em;color:var(--ink)}
    .page-subtitle{color:var(--muted);font-size:13px}

    /* ── Stats grid ──────────────────────────────────────── */
    .stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
    .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
    .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:8px;font-weight:500}
    .stat-value{font-family:var(--font-display);font-size:29px;font-weight:400;letter-spacing:-.02em;line-height:1;color:var(--ink)}
    .stat-note{font-size:11px;color:var(--muted);margin-top:7px}
    .stat-delta{font-size:11px;margin-top:4px;font-weight:500}
    .delta-up{color:var(--green)}
    .delta-down{color:var(--red)}

    /* ── Cards ────────────────────────────────────────────── */
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:20px}
    .card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;gap:12px}
    .card-head h3{font-family:var(--font-display);font-size:15px;font-weight:400;color:var(--ink)}
    .grid-2{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:start}

    /* ── Bar chart (SVG) ─────────────────────────────────── */
    .bar-chart{width:100%;height:auto;display:block}

    /* ── Interest bars ───────────────────────────────────── */
    .bars{display:flex;flex-direction:column;gap:9px}
    .bar{display:flex;align-items:center;gap:11px}
    .bar-name{width:130px;font-size:12px;color:var(--text);text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bar-track{flex:1;height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden}
    .bar-fill{height:100%;background:var(--gold);border-radius:4px}
    .bar-val{width:28px;text-align:right;font-family:var(--font-display);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}

    /* ── Tables ─────────────────────────────────────────── */
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
    td{padding:13px 10px;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--text);vertical-align:middle}
    tbody tr{cursor:pointer;transition:background .15s}
    tbody tr:hover td{background:var(--surface-2)}
    .who-cell strong{display:block;color:var(--ink);font-weight:500}
    .who-cell span{font-size:11.5px;color:var(--muted)}
    .num{font-family:var(--font-display);font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
    .empty{text-align:center;padding:44px 20px;color:var(--muted);font-size:13px;line-height:1.7}

    /* ── Badges ─────────────────────────────────────────── */
    .badge{display:inline-block;padding:3px 9px;border-radius:var(--radius-badge);font-size:10.5px;letter-spacing:.03em;white-space:nowrap;font-weight:400}
    .badge-green{background:var(--green-dim);color:var(--green)}
    .badge-red{background:var(--red-dim);color:var(--red)}
    .badge-orange{background:var(--orange-dim);color:var(--orange)}
    .badge-accent{background:var(--accent-dim);color:var(--accent)}
    .badge-muted{background:rgba(112,108,100,.1);color:var(--muted)}

    /* ── Tabs ───────────────────────────────────────────── */
    .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
    .tab{padding:10px 18px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap;transition:all .18s}
    .tab:hover{color:var(--ink)}
    .tab.active{color:var(--gold);border-bottom-color:var(--gold)}
    .workspace-content{min-height:200px}

    /* ── Empty state ─────────────────────────────────────── */
    .empty-state{text-align:center;padding:60px 24px;color:var(--muted)}
    .empty-state-icon{font-size:32px;margin-bottom:12px;opacity:.4}
    .empty-state-title{font-family:var(--font-display);font-size:18px;color:var(--ink);margin-bottom:8px;font-weight:400}
    .empty-state-text{font-size:13px;max-width:360px;margin:0 auto;line-height:1.6}

    /* ── Detail drawer ──────────────────────────────────── */
    .drawer-back{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .28s;z-index:40}
    .drawer-back.on{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:transform .34s cubic-bezier(.22,.61,.36,1);overflow-y:auto;padding:28px}
    .drawer.on{transform:translateX(0)}
    .drawer-close{position:absolute;top:20px;right:22px;background:none;border:0;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
    .drawer-close:hover{color:var(--ink)}
    .drawer h2{font-family:var(--font-display);font-size:21px;font-weight:400;margin:6px 0 3px;padding-right:30px;color:var(--ink)}
    .drawer-email{font-size:13px;color:var(--muted);margin-bottom:20px;word-break:break-all}
    .kv{display:grid;grid-template-columns:118px 1fr;gap:9px 14px;font-size:12.5px;margin-bottom:22px}
    .kv dt{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.07em;padding-top:2px}
    .kv dd{color:var(--ink);line-height:1.55}
    .sec{border-top:1px solid var(--line);padding-top:18px;margin-bottom:20px}
    .sec h4{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:11px;font-weight:500}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:5px 10px;font-size:12px;color:var(--text)}
    .qlist{display:flex;flex-direction:column;gap:9px}
    .qlist div{background:var(--surface-2);border-left:2px solid var(--gold);padding:9px 12px;font-size:12.5px;line-height:1.55;color:var(--ink)}
    .timeline{display:flex;flex-direction:column}
    .tl{display:flex;gap:11px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
    .tl:last-child{border:0}
    .tl .tl-t{width:52px;flex-shrink:0;color:var(--muted);font-family:var(--font-mono);font-size:11px;padding-top:1px}
    .tl .tl-e{flex:1;line-height:1.5}
    .tl .tl-e b{font-weight:500;color:var(--ink)}
    .tl .tl-e span{color:var(--muted)}
    .drawer textarea{width:100%;min-height:70px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--ink);resize:vertical;font-size:13px}
    .drawer textarea:focus{outline:none;border-color:var(--gold)}
    .actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
    .saved{font-size:11.5px;color:var(--green)}

    /* ── Activity items ──────────────────────────────────── */
    .activity-item{display:flex;gap:10px;padding:8px 0}
    .activity-dot{flex-shrink:0;line-height:1.4}
    .activity-body{flex:1}
    .activity-text{font-size:13px;color:var(--text);line-height:1.5}
    .activity-time{font-size:11px;color:var(--muted)}

    /* ── Toast ────────────────────────────────────────────── */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface-2);border:1px solid var(--line);color:var(--ink);padding:10px 20px;border-radius:var(--radius);font-size:13px;z-index:100;opacity:0;transition:all .3s ease;pointer-events:none}
    .toast-show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
    .toast-success{border-color:var(--green);color:var(--green)}
    .toast-error{border-color:var(--red);color:var(--red)}

    /* ── Property grid ───────────────────────────────────── */
    .property-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .property-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:border-color .18s,transform .18s}
    .property-card:hover{border-color:var(--muted);transform:translateY(-2px)}
    .property-card-cover{height:140px;background:var(--surface-2);overflow:hidden;position:relative}
    .property-card-cover img{width:100%;height:100%;object-fit:cover}
    .property-card-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--muted);opacity:.3}
    .property-card-body{padding:14px 16px}
    .property-card-top{margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap}
    .property-card-title{font-family:var(--font-display);font-size:16px;font-weight:400;color:var(--ink);margin-bottom:4px}
    .property-card-location{font-size:12px;color:var(--text);margin-bottom:8px}
    .property-card-meta{display:flex;gap:12px;font-size:11px;color:var(--muted)}
    .property-card-meta span{white-space:nowrap}
    .property-list-loading{text-align:center;padding:40px;color:var(--muted);font-size:13px}

    /* ── Overview grid (workspace) ───────────────────────── */
    .overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

    /* ── Content editor (M5.2) ───────────────────────────── */
    .ce{max-width:840px}
    .ce-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0}
    .ce-status{font-size:11px;color:var(--muted)}
    .ce-section{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
    .ce-section-head{display:flex;align-items:center;gap:8px;width:100%;padding:12px 16px;background:var(--surface);border:none;color:var(--ink);cursor:pointer;font-family:var(--font-display);font-size:15px;font-weight:400;text-align:left}
    .ce-section-head:hover{background:var(--surface-2)}
    .ce-section-arrow{font-size:12px;color:var(--muted);width:14px;text-align:center}
    .ce-section-body{padding:16px;background:var(--bg)}
    .ce-field{margin-bottom:14px}
    .ce-field:last-child{margin-bottom:0}
    .ce-label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.03em;text-transform:uppercase}
    .ce-input{width:100%;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--ink);font-size:13px;font-family:var(--font-body);outline:none;transition:border-color .15s}
    .ce-input:focus{border-color:var(--gold)}
    .ce-textarea{width:100%;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--ink);font-size:13px;font-family:var(--font-body);outline:none;min-height:64px;resize:vertical;transition:border-color .15s}
    .ce-textarea:focus{border-color:var(--gold)}
    select.ce-input{appearance:auto;cursor:pointer}
    .ce-readonly{padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--muted);font-size:13px}
    .ce-subsec{display:flex;align-items:center;gap:12px;margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
    .ce-subsec-label{font-size:11px;color:var(--gold);letter-spacing:.04em;text-transform:uppercase;flex:1}
    .ce-add-btn{font-size:11px;padding:4px 10px}
    .ce-repeat-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px}
    .ce-repeat-item:last-child{margin-bottom:0}
    .ce-repeat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .ce-repeat-num{font-family:var(--font-mono);font-size:12px;color:var(--gold);font-weight:500}
    .ce-repeat-actions{display:flex;gap:4px}
    .ce-repeat-inline{display:flex;align-items:flex-end;gap:10px}
    .ce-repeat-inline .ce-field{flex:1;margin-bottom:0}
    .ce-icon-btn{background:none;border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--muted);cursor:pointer;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;transition:border-color .15s,color .15s}
    .ce-icon-btn:hover{border-color:var(--text);color:var(--ink)}
    .ce-icon-del:hover{border-color:var(--red);color:var(--red)}
    .ce-bilingual{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .ce-bilingual-group{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .ce-bi-col{display:flex;flex-direction:column;gap:6px}
    .ce-bi-tag{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
    .ce-bi-lang{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    .ce-field-bi .ce-label{margin-bottom:8px}
    .btn-outline{background:none;border:1px solid var(--line);color:var(--text);border-radius:var(--radius-sm);cursor:pointer;transition:border-color .15s,color .15s}
    .btn-outline:hover{border-color:var(--gold);color:var(--ink)}
    @media(max-width:640px){
      .ce-bilingual,.ce-bilingual-group{grid-template-columns:1fr}
      .ce-repeat-inline{flex-direction:column;align-items:stretch}
    }

    /* ── Responsive ──────────────────────────────────────── */
    @media(max-width:1100px){
      .stats-grid{grid-template-columns:repeat(3,1fr)}
      .grid-2{grid-template-columns:1fr}
    }
    @media(max-width:820px){
      .menu-toggle{display:block}
      .sidebar{transform:translateX(-100%);transition:transform .3s ease}
      .sidebar.sidebar-open{transform:translateX(0)}
      .main{margin-left:0}
      .stats-grid{grid-template-columns:repeat(2,1fr)}
      .content{padding:18px 14px 40px}
      .topbar{padding:12px 14px;flex-wrap:wrap;justify-content:flex-start}
      .drawer{padding:22px 18px}
      .tabs{gap:0}
      .tab{padding:10px 12px;font-size:12px}
    }
    @media(max-width:480px){
      .stats-grid{grid-template-columns:1fr 1fr}
      .kv{grid-template-columns:100px 1fr;gap:6px 10px}
    }
  </style>
</head>
<body>

<!-- ══════════════ LOGIN GATE ══════════════ -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="mono">Larum Studio</div>
    <h1>Property Admin</h1>
    <p class="sub mono">Private · signed-in access only</p>
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Sign in</button>
    </form>
    <div class="gate-error" id="gateError"></div>
    <div class="gate-note">
      There is no sign-up. The account is created by hand in Supabase &rarr;
      Authentication &rarr; Users. See <code>docs/supabase-fix-rls.sql</code>.
    </div>
  </div>
</div>

<!-- ══════════════ APP ══════════════ -->
<div class="app" id="app">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h2>Larum</h2>
      <small>Property Admin</small>
    </div>

    <div class="sidebar-nav">
      <button data-nav="dashboard" class="active"><span class="icon">◆</span> Dashboard</button>
      <button data-nav="clientes"><span class="icon">◎</span> Clientes</button>
      <button data-nav="agentes"><span class="icon">◈</span> Agentes</button>
      <button data-nav="propiedades"><span class="icon">◇</span> Propiedades</button>
      <button data-nav="auditorias"><span class="icon">◉</span> Auditorías</button>
      <button data-nav="leads"><span class="icon">◈</span> Leads <span class="count" id="navLeads">0</span></button>
      <button data-nav="analytics"><span class="icon">◆</span> Analytics</button>
      <button data-nav="ajustes"><span class="icon">◎</span> Ajustes</button>
    </div>

    <div class="sidebar-foot">
      <span class="who" id="whoami"></span>
      <button id="signOutBtn">Sign out</button>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">&#9776;</button>
      <div class="topbar-right">
        <input type="search" id="search" placeholder="Search name, email, question..." />
        <select id="propertyFilter"><option value="all">All properties</option></select>
        <select id="periodFilter">
          <option value="30">Last 30 days</option>
          <option value="7">Last 7 days</option>
          <option value="90">Last 90 days</option>
          <option value="3650">All time</option>
        </select>
        <button class="btn btn-outline" id="refreshBtn">Refresh</button>
        <button class="btn btn-outline" id="exportBtn">Export CSV</button>
      </div>
    </div>

    <div class="content">
      <div class="banner" id="banner"></div>
      <div id="viewContent"></div>
    </div>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="drawer-back" id="drawerBack"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<script type="module">
import { boot, enterApp, signOut, load, buildPropertyFilter, filteredLeads, filteredSessions } from './admin/admin-core.js';
import { navigate, register, init as routerInit, current as currentRoute } from './admin/admin-router.js';
import { closeDrawer, initMobileMenu } from './admin/admin-ui.js';
import * as dashboard from './admin/admin-dashboard.js';
import * as leads from './admin/admin-leads.js';
import * as sessions from './admin/admin-sessions.js';
import * as properties from './admin/admin-properties.js';
import * as workspace from './admin/admin-workspace.js';

register('dashboard', dashboard);
register('clientes', null);
register('agentes', null);
register('propiedades', properties);
register('auditorias', null);
register('leads', leads);
register('analytics', null);
register('ajustes', null);
register('sessions', sessions);
register('workspace', workspace);

/* ── Login form ──────────────────────────────────────────── */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('gateError');
  btn.disabled = true;
  err.textContent = '';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    err.textContent = error.message;
    btn.disabled = false;
    return;
  }

  enterApp(data.session);
});

/* ── Sidebar navigation ─────────────────────────────────── */
document.querySelectorAll('[data-nav]').forEach(btn => {
  btn.addEventListener('click', () => navigate(btn.dataset.nav));
});

/* ── Sign out ────────────────────────────────────────────── */
document.getElementById('signOutBtn').addEventListener('click', signOut);

/* ── Drawer backdrop close ───────────────────────────────── */
document.getElementById('drawerBack').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* ── Topbar controls ─────────────────────────────────────── */
document.getElementById('search').addEventListener('input', () => {
  const route = currentRoute();
  if (route) navigate(route);
});

document.getElementById('propertyFilter').addEventListener('change', () => {
  const route = currentRoute();
  if (route) navigate(route);
});

document.getElementById('periodFilter').addEventListener('change', () => load());
document.getElementById('refreshBtn').addEventListener('click', () => load());

document.getElementById('exportBtn').addEventListener('click', () => {
  const route = currentRoute();
  const rows = route === 'sessions' ? filteredSessions() : filteredLeads();
  const cols = route === 'sessions'
    ? ['created_at', 'property', 'lang', 'entry_path', 'duration_seconds', 'concierge_questions',
       'qualified', 'calculator_used', 'film_watched', 'enquiry_sent', 'id']
    : ['created_at', 'property', 'lang', 'name', 'email', 'interest', 'message', 'entry_path',
       'duration_minutes', 'qualified', 'calculator_used', 'film_watched', 'status', 'session_id'];

  const csv = [cols.join(',')].concat(rows.map(r =>
    cols.map(c => {
      let v = r[c];
      if (Array.isArray(v)) v = v.join(' | ');
      if (v && typeof v === 'object') v = JSON.stringify(v);
      return '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
    }).join(',')
  )).join('\n');

  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'larum-' + (route || 'data') + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
});

/* ── Data loaded event ───────────────────────────────────── */
document.addEventListener('larum:data-loaded', () => {
  buildPropertyFilter();
  document.getElementById('navLeads').textContent = filteredLeads().length;
  const route = currentRoute();
  if (route) navigate(route);
});

/* ── Mobile menu ─────────────────────────────────────────── */
initMobileMenu();

/* ── Boot ────────────────────────────────────────────────── */
routerInit();
boot();
</script>
</body>
</html>
